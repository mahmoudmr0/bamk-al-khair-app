<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام البصمة الإلكترونية - مؤسسة بنك الخير</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap');
body{font-family:'Cairo',sans-serif;background:#0f172a;color:#f8fafc}
.nb:active{transform:scale(.92)}
@media print{
 body{background:#fff!important;color:#000!important}
 header,#employeeSection,#adminLoginForm,.no-print,.hide-on-print{display:none!important}
 #adminModal{position:static!important;background:transparent!important}
 #adminDashboard{max-height:none!important;overflow:visible!important;border:none!important;background:transparent!important;color:#000!important}
 table{width:100%!important;border-collapse:collapse!important}
 th,td{border:1px solid #333!important;padding:8px!important;color:#000!important}
}
</style>
</head>
<body class="min-h-screen flex flex-col justify-between bg-slate-900">

<header class="bg-slate-800 border-b border-slate-700 p-4 shadow-lg">
 <div class="max-w-6xl mx-auto flex justify-between items-center">
  <div class="flex items-center gap-3">
   <div class="w-12 h-12 bg-emerald-600 rounded-full flex items-center justify-center text-2xl text-white"><i class="fa-solid fa-hand-holding-heart"></i></div>
   <div>
    <h1 class="text-xl font-extrabold text-emerald-400">مؤسسة بنك الخير للتنمية المستدامة</h1>
    <p class="text-xs text-slate-400">نظام تسجيل الحضور والانصراف السحابي الذكي</p>
   </div>
  </div>
  <button onclick="toggleAdminModal()" class="bg-slate-700 hover:bg-slate-600 text-slate-200 px-4 py-2 rounded-lg text-sm font-semibold border border-slate-600 flex items-center gap-2">
   <i class="fa-solid fa-user-shield text-amber-400"></i><span>دخول المدير</span>
  </button>
 </div>
</header>

<main id="employeeSection" class="flex-1 flex flex-col items-center justify-center p-4">
 <div class="bg-slate-800 border border-slate-700 rounded-2xl shadow-2xl p-6 sm:p-8 w-full max-w-md text-center">
  <div class="mb-4">
   <span id="camStatus" class="inline-block px-3 py-1 bg-emerald-950 text-emerald-400 text-xs font-semibold rounded-full border border-emerald-800 mb-2">جاري الاتصال...</span>
   <h2 class="text-xl font-bold text-slate-100">أهلاً بك! سجّل رقمك السري (PIN)</h2>
  </div>
  <input type="password" id="pinDisplay" readonly placeholder="• • • •" class="w-full mb-6 text-center text-3xl font-bold tracking-widest bg-slate-900 border-2 border-emerald-500/50 text-emerald-400 py-3 rounded-xl focus:outline-none">
  <div id="welcomeCard" class="hidden mb-6 p-3 bg-emerald-900/40 border border-emerald-500/40 rounded-xl flex items-center justify-center gap-3">
   <i class="fa-solid fa-circle-check text-emerald-400 text-2xl"></i>
   <div class="text-right">
    <div id="welcomeName" class="font-bold text-lg text-white"></div>
    <div id="welcomeTitle" class="text-xs text-emerald-300"></div>
    <div id="welcomeBranch" class="text-[11px] text-amber-300 font-bold mt-0.5"></div>
   </div>
  </div>
  <div id="numpad" dir="ltr" class="grid grid-cols-3 gap-3 mb-6"></div>
  <div class="grid grid-cols-2 gap-4">
   <button id="btnIn" onclick="punch('IN')" class="bg-emerald-600 hover:bg-emerald-500 disabled:opacity-50 text-white font-extrabold py-3 rounded-xl flex items-center justify-center gap-2"><i class="fa-solid fa-right-to-bracket"></i> تسجيل دخول</button>
   <button id="btnOut" onclick="punch('OUT')" class="bg-rose-600 hover:bg-rose-500 disabled:opacity-50 text-white font-extrabold py-3 rounded-xl flex items-center justify-center gap-2"><i class="fa-solid fa-right-from-bracket"></i> تسجيل خروج</button>
  </div>
  <div id="statusMsg" class="mt-4 text-sm font-semibold text-slate-400 min-h-[24px]"></div>
 </div>
</main>

<div id="adminModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
 <div id="adminLoginForm" class="bg-slate-800 border border-slate-700 rounded-2xl p-6 w-full max-w-sm text-right">
  <div class="flex justify-between items-center mb-4">
   <h3 class="text-lg font-bold text-emerald-400"><i class="fa-solid fa-lock me-2"></i>دخول الإدارة</h3>
   <button onclick="toggleAdminModal()" class="text-slate-400"><i class="fa-solid fa-xmark text-xl"></i></button>
  </div>
  <div class="space-y-4">
   <input type="text" id="adminUser" autocapitalize="none" autocomplete="off" spellcheck="false" placeholder="اسم المستخدم" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white text-sm">
   <input type="password" id="adminPass" placeholder="كلمة السر" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white text-sm">
   <button id="loginBtn" onclick="loginAdmin()" class="w-full bg-emerald-600 hover:bg-emerald-500 disabled:opacity-50 text-white font-bold py-2.5 rounded-lg">دخول</button>
  </div>
 </div>

 <div id="adminDashboard" class="bg-slate-800 border border-slate-700 rounded-2xl p-6 w-full max-w-5xl max-h-[90vh] overflow-y-auto hidden">
  <div class="flex justify-between items-center pb-4 border-b border-slate-700 mb-6 no-print">
   <div>
    <h3 id="dashboardTitle" class="text-xl font-bold text-emerald-400"></h3>
    <p id="loggedAdminBadge" class="text-xs text-amber-300 font-bold mt-1"></p>
   </div>
   <button onclick="logoutAdmin()" class="bg-rose-900/60 text-rose-200 px-3 py-1.5 rounded-lg text-xs font-bold">تسجيل الخروج</button>
  </div>
  <div class="flex border-b border-slate-700 mb-6 no-print overflow-x-auto">
   <button id="tabRepBtn" onclick="switchTab('rep')" class="px-4 py-2 font-bold text-sm whitespace-nowrap">التقارير وسجلات الحضور</button>
   <button id="tabEmpBtn" onclick="switchTab('emp')" class="px-4 py-2 font-bold text-sm whitespace-nowrap">إضافة موظف جديد</button>
   <button id="tabMgrBtn" onclick="switchTab('mgr')" class="px-4 py-2 font-bold text-sm whitespace-nowrap">إضافة مدير فرع</button>
  </div>

  <div id="tabEmp" class="space-y-6 hidden no-print">
   <div class="bg-slate-900 p-4 rounded-xl border border-slate-700 space-y-4">
    <div class="grid grid-cols-1 sm:grid-cols-4 gap-3">
     <div><label class="text-xs text-slate-400 mb-1 block">الفرع:</label><select id="empBranchSelect" class="bg-slate-800 border border-slate-700 rounded-lg p-2 text-sm text-emerald-400 w-full"></select></div>
     <div><label class="text-xs text-slate-400 mb-1 block">الاسم الكامل:</label><input type="text" id="empFullName" class="bg-slate-800 border border-slate-700 rounded-lg p-2 text-sm text-white w-full"></div>
     <div><label class="text-xs text-slate-400 mb-1 block">المسمى الوظيفي:</label><input type="text" id="empJobTitle" class="bg-slate-800 border border-slate-700 rounded-lg p-2 text-sm text-white w-full"></div>
     <div><label class="text-xs text-slate-400 mb-1 block">رقم البصمة (PIN) 4-6 أرقام:</label><input type="text" id="empPin" inputmode="numeric" maxlength="6" class="bg-slate-800 border border-slate-700 rounded-lg p-2 text-sm text-white w-full"></div>
    </div>
    <div class="flex flex-wrap items-center gap-3 pt-2">
     <button id="saveEmpBtn" onclick="saveEmployee()" class="bg-emerald-600 hover:bg-emerald-500 disabled:opacity-50 text-white font-bold py-2 px-4 rounded-lg text-sm">حفظ الموظف</button>
     <div id="addBranchWrapper" class="flex items-center gap-2">
      <input type="text" id="newBranchInput" placeholder="اسم فرع جديد" class="bg-slate-800 border border-slate-700 rounded-lg p-2 text-sm text-white">
      <button onclick="addNewBranchOption()" class="bg-slate-700 hover:bg-slate-600 text-amber-400 font-bold py-2 px-3 rounded-lg text-sm">+ إضافة فرع للقائمة</button>
     </div>
    </div>
   </div>
   <div class="overflow-x-auto bg-slate-900 rounded-xl border border-slate-700">
    <h5 class="p-3 bg-slate-800 font-bold text-xs text-slate-200 border-b border-slate-700">قائمة الموظفين المسجلين</h5>
    <table class="w-full text-right text-xs text-slate-300">
     <thead class="bg-slate-800 text-slate-200"><tr><th class="p-3">الفرع</th><th class="p-3">الاسم الكامل</th><th class="p-3">المسمى الوظيفي</th></tr></thead>
     <tbody id="empTableBody"></tbody>
    </table>
   </div>
  </div>

  <div id="tabMgr" class="space-y-6 hidden no-print">
   <div class="bg-slate-900 p-4 rounded-xl border border-slate-700 space-y-4">
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
     <div><label class="text-xs text-slate-400 mb-1 block">الفرع المسئول عنه:</label><select id="mgrBranchSelect" class="bg-slate-800 border border-slate-700 rounded-lg p-2 text-sm text-emerald-400 w-full"></select></div>
     <div><label class="text-xs text-slate-400 mb-1 block">اسم المستخدم:</label><input type="text" id="mgrUser" autocomplete="off" class="bg-slate-800 border border-slate-700 rounded-lg p-2 text-sm text-white w-full"></div>
     <div><label class="text-xs text-slate-400 mb-1 block">كلمة السر (6 أحرف+):</label><input type="password" id="mgrPass" autocomplete="new-password" class="bg-slate-800 border border-slate-700 rounded-lg p-2 text-sm text-white w-full"></div>
    </div>
    <button id="saveMgrBtn" onclick="saveAdmin()" class="bg-amber-600 hover:bg-amber-500 disabled:opacity-50 text-white font-bold py-2 px-6 rounded-lg text-sm">حفظ المدير</button>
   </div>
   <div class="overflow-x-auto bg-slate-900 rounded-xl border border-slate-700">
    <table class="w-full text-right text-xs text-slate-300">
     <thead class="bg-slate-800 text-slate-200"><tr><th class="p-3">الفرع المسئول</th><th class="p-3">اسم المستخدم</th></tr></thead>
     <tbody id="mgrTableBody"></tbody>
    </table>
   </div>
  </div>

  <div id="tabRep" class="space-y-6">
   <div class="bg-slate-900 p-4 rounded-xl border border-slate-700 flex flex-col sm:flex-row items-center justify-between gap-4 no-print">
    <div class="flex items-center gap-3 w-full sm:w-auto">
     <label class="text-sm font-bold text-slate-200 whitespace-nowrap">عرض تقرير فرع:</label>
     <select id="branchFilter" onchange="renderTables()" class="bg-slate-800 border border-slate-700 text-emerald-400 font-bold rounded-lg p-2 text-sm w-full sm:w-64"></select>
    </div>
    <div class="flex items-center gap-2">
     <button onclick="refreshData()" class="bg-slate-700 text-slate-200 text-xs font-bold py-2 px-3 rounded-lg border border-slate-600"><i class="fa-solid fa-rotate"></i> تحديث</button>
     <button onclick="exportToExcel()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold py-2 px-3 rounded-lg"><i class="fa-solid fa-file-excel"></i> تصدير Excel</button>
     <button onclick="window.print()" class="bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs font-bold py-2 px-3 rounded-lg border border-slate-600"><i class="fa-solid fa-print"></i> طباعة</button>
     <button onclick="delAllLogs()" class="bg-rose-900/60 hover:bg-rose-800 text-rose-200 text-xs font-bold py-2 px-3 rounded-lg border border-rose-800"><i class="fa-solid fa-trash-can"></i> حذف الكل</button>
    </div>
   </div>
   <div id="reportCount" class="text-xs text-slate-400 font-semibold px-1"></div>
   <div class="overflow-x-auto bg-slate-900 rounded-xl border border-slate-700">
    <table class="w-full text-right text-xs text-slate-300">
     <thead class="bg-slate-800 text-slate-200">
      <tr><th class="p-3">الفرع</th><th class="p-3">اسم الموظف</th><th class="p-3">التاريخ</th><th class="p-3">وقت الدخول</th><th class="p-3">وقت الخروج</th><th class="p-3">الحالة</th><th class="p-3 text-center hide-on-print">حذف</th></tr>
     </thead>
     <tbody id="repTableBody"></tbody>
    </table>
   </div>
  </div>
 </div>
</div>

<script>
const API = "https://script.google.com/macros/s/AKfycbz6KCMe9--_LOKi4i9x5WLWcuXh27SkLK5_NcV8bU-W9pXOxTDqc6ga2lVXOvNBFGFV/exec";
let D = { employees: [], logs: [], admins: [], branches: [] };
let pin = '', token = null, me = null, busy = false;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

async function api(body) {
  const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
  const j = await r.json();
  if (j.auth) { logoutAdmin(true); }
  return j;
}
function speak(t) {
  if (!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(t); u.lang = 'ar-SA'; speechSynthesis.speak(u);
}
function setStatus(t, cls) { const s = $('statusMsg'); s.textContent = t; s.className = 'mt-4 text-sm font-semibold min-h-[24px] ' + (cls || 'text-slate-400'); }

// ---- شاشة الموظف ----
(function () {
  const keys = ['1','2','3','4','5','6','7','8','9','C','0','B'];
  $('numpad').innerHTML = keys.map(k => k === 'C'
    ? '<button onclick="clearPin()" class="nb bg-rose-900/60 text-rose-200 text-sm font-bold py-3 rounded-xl">مسح</button>'
    : k === 'B' ? '<button onclick="backspacePin()" class="nb bg-slate-700 text-slate-300 text-lg py-3 rounded-xl"><i class="fa-solid fa-delete-left"></i></button>'
    : `<button onclick="pressNum('${k}')" class="nb bg-slate-700 text-2xl font-bold text-slate-100 py-3 rounded-xl">${k}</button>`).join('');
  fetch(API).then(r => r.json()).then(() => { $('camStatus').textContent = '● الجهاز متصل سحابياً'; })
    .catch(() => { $('camStatus').textContent = '❌ خطأ في الاتصال بشيت جوجل'; });
})();
function pressNum(n) { if (pin.length < 6) { pin += n; $('pinDisplay').value = pin; } }
function backspacePin() { pin = pin.slice(0, -1); $('pinDisplay').value = pin; }
function clearPin() { pin = ''; $('pinDisplay').value = ''; $('welcomeCard').classList.add('hidden'); setStatus(''); }

async function punch(type) {
  if (busy) return;
  if (pin.length < 4) { setStatus('❌ اكتب الرقم السري أولاً', 'text-rose-400'); return; }
  busy = true; $('btnIn').disabled = $('btnOut').disabled = true;
  setStatus('جاري التسجيل...');
  try {
    const r = await api({ action: 'PUNCH', pin, type });
    if (r.ok) {
      $('welcomeName').textContent = r.name; $('welcomeTitle').textContent = r.title; $('welcomeBranch').textContent = '📍 ' + r.branch;
      $('welcomeCard').classList.remove('hidden');
      const first = r.name.split(' ')[0];
      if (type === 'IN') { setStatus('🟢 تم تسجيل دخول: ' + r.name, 'text-emerald-400'); speak('تم تسجيل حضورك بنجاح يا ' + first); }
      else { setStatus('🔴 تم تسجيل خروج: ' + r.name, 'text-rose-400'); speak('تم تسجيل خروجك بنجاح يا ' + first); }
      setTimeout(clearPin2, 3000);
    } else { setStatus('⚠️ ' + r.msg, 'text-amber-400'); speak(r.msg); setTimeout(clearPin2, 3000); }
  } catch (e) { setStatus('❌ فشل الاتصال، لم يتم التسجيل. حاول مرة أخرى', 'text-rose-400'); }
  busy = false; $('btnIn').disabled = $('btnOut').disabled = false;
}
function clearPin2() { pin = ''; $('pinDisplay').value = ''; $('welcomeCard').classList.add('hidden'); }

// ---- الإدارة ----
function toggleAdminModal() { $('adminModal').classList.toggle('hidden'); }
const isGen = () => me && me.branch === 'الكل';

async function loginAdmin() {
  const u = $('adminUser').value.trim(), p = $('adminPass').value.trim();
  if (!u || !p) return alert('اكتب اسم المستخدم وكلمة السر');
  $('loginBtn').disabled = true;
  try {
    const r = await api({ action: 'LOGIN', username: u, password: p });
    if (!r.ok) { alert(r.msg); speak('كلمة السر غير صحيحة'); return; }
    token = r.token; me = { branch: r.branch, username: r.username };
    $('adminPass').value = '';
    $('adminLoginForm').classList.add('hidden'); $('adminDashboard').classList.remove('hidden');
    $('dashboardTitle').textContent = isGen() ? 'لوحة الإدارة الموحدة' : 'لوحة إدارة - فرع ' + me.branch;
    $('loggedAdminBadge').textContent = 'المستخدم الحالي: ' + me.username + ' (' + (isGen() ? 'مدير عام' : 'مدير فرع ' + me.branch) + ')';
    $('tabMgrBtn').classList.toggle('hidden', !isGen());
    $('addBranchWrapper').classList.toggle('hidden', !isGen());
    switchTab('rep');
    await refreshData();
    speak('مرحباً بك يا ' + me.username);
  } catch (e) { alert('خطأ في الاتصال'); }
  finally { $('loginBtn').disabled = false; }
}
function logoutAdmin(expired) {
  token = null; me = null; D = { employees: [], logs: [], admins: [], branches: [] };
  ['repTableBody', 'empTableBody', 'mgrTableBody'].forEach(i => $(i).innerHTML = '');
  $('adminDashboard').classList.add('hidden'); $('adminLoginForm').classList.remove('hidden');
  if (!expired) toggleAdminModal();
}
async function refreshData() {
  const r = await api({ action: 'DATA', token });
  if (!r.ok) return alert(r.msg);
  D = r; updateBranchDropdowns(); renderTables();
}
function updateBranchDropdowns() {
  const keep = $('empBranchSelect').value, f = $('branchFilter').value;
  const bs = D.branches.length ? D.branches : ['الفرع الرئيسي'];
  const opts = bs.map(b => `<option value="${esc(b)}">${esc(b)}</option>`).join('');
  $('branchFilter').innerHTML = (isGen() ? '<option value="ALL">كل الفروع</option>' : '') + opts;
  $('empBranchSelect').innerHTML = opts;
  $('mgrBranchSelect').innerHTML = '<option value="الكل">الكل (مدير عام)</option>' + opts;
  if (keep && bs.includes(keep)) $('empBranchSelect').value = keep;
  if (f && [...$('branchFilter').options].some(o => o.value === f)) $('branchFilter').value = f;
  $('branchFilter').disabled = $('empBranchSelect').disabled = !isGen();
}
function addNewBranchOption() {
  const v = $('newBranchInput').value.trim(); if (!v) return;
  if (![...$('empBranchSelect').options].some(o => o.value === v)) {
    for (const id of ['empBranchSelect', 'mgrBranchSelect']) { const o = document.createElement('option'); o.value = o.textContent = v; $(id).appendChild(o); }
  }
  $('empBranchSelect').value = v; $('newBranchInput').value = '';
  alert('تمت إضافة "' + v + '" للقائمة. سيُحفظ الفرع عند حفظ أول موظف فيه.');
}
async function saveEmployee() {
  const n = $('empFullName').value.trim(), t = $('empJobTitle').value.trim(), p = $('empPin').value.trim();
  if (!n || !p) return alert('يرجى كتابة الاسم ورقم الـ PIN');
  if (!/^\d{4,6}$/.test(p)) return alert('الـ PIN لازم يكون من 4 إلى 6 أرقام');
  $('saveEmpBtn').disabled = true;
  try {
    const r = await api({ action: 'ADD_EMP', token, branchName: $('empBranchSelect').value, fullName: n, title: t || 'موظف', pin: p });
    if (!r.ok) return alert(r.msg);
    alert('تم حفظ الموظف بنجاح');
    ['empFullName', 'empJobTitle', 'empPin'].forEach(i => $(i).value = '');
    await refreshData();
  } catch (e) { alert('فشل الاتصال، لم يتم الحفظ'); }
  finally { $('saveEmpBtn').disabled = false; }
}
async function saveAdmin() {
  const u = $('mgrUser').value.trim(), p = $('mgrPass').value.trim();
  if (!u || p.length < 6) return alert('اكتب اسم المستخدم وكلمة سر من 6 أحرف على الأقل');
  $('saveMgrBtn').disabled = true;
  try {
    const r = await api({ action: 'ADD_ADMIN', token, branch: $('mgrBranchSelect').value, username: u, password: p });
    if (!r.ok) return alert(r.msg);
    alert('تمت إضافة المدير (' + u + ')');
    $('mgrUser').value = $('mgrPass').value = '';
    await refreshData();
  } catch (e) { alert('فشل الاتصال، لم يتم الحفظ'); }
  finally { $('saveMgrBtn').disabled = false; }
}
async function delLog(id) {
  const l = D.logs.find(x => x.id === id); if (!l) return;
  if (!confirm(`حذف سجل (${l.status}) للموظف (${l.empName}) بتاريخ ${l.date} نهائياً؟`)) return;
  try {
    const r = await api({ action: 'DELETE_LOG', token, id });
    if (!r.ok) return alert(r.msg);
    await refreshData();
  } catch (e) { alert('فشل الاتصال، لم يتم الحذف'); }
}
async function delAllLogs() {
  const b = $('branchFilter').value || 'ALL', n = filteredLogs().length;
  if (!n) return alert('لا توجد سجلات للحذف');
  const lbl = b === 'ALL' ? 'كل الفروع' : 'فرع ' + b;
  if (!confirm(`سيتم حذف ${n} سجل (${lbl}) نهائياً من الشيت. يفضل تصدير Excel أولاً. هل تريد المتابعة؟`)) return;
  if (prompt('للتأكيد اكتب كلمة: حذف') !== 'حذف') return;
  try {
    const r = await api({ action: 'DELETE_ALL_LOGS', token, branch: b });
    if (!r.ok) return alert(r.msg);
    alert('تم حذف ' + r.deleted + ' سجل');
    await refreshData();
  } catch (e) { alert('فشل الاتصال، لم يتم الحذف'); }
}
function filteredLogs() {
  const b = $('branchFilter').value;
  return (!b || b === 'ALL') ? D.logs : D.logs.filter(l => l.branchName.trim() === b.trim());
}
function renderTables() {
  $('empTableBody').innerHTML = D.employees.map(e => `<tr class="border-b border-slate-800"><td class="p-3 font-bold text-amber-400">${esc(e.branchName)}</td><td class="p-3 font-bold text-white">${esc(e.fullName)}</td><td class="p-3">${esc(e.title)}</td></tr>`).join('');
  $('mgrTableBody').innerHTML = D.admins.map(a => `<tr class="border-b border-slate-800"><td class="p-3 font-bold text-amber-400">${esc(a.branch)}</td><td class="p-3 font-bold text-emerald-400">${esc(a.username)}</td></tr>`).join('');
  const ls = filteredLogs();
  $('reportCount').textContent = 'عدد السجلات المعروضة: ' + ls.length;
  $('repTableBody').innerHTML = ls.slice().reverse().map(l => `<tr class="border-b border-slate-800"><td class="p-3 font-bold text-amber-400">${esc(l.branchName)}</td><td class="p-3 font-bold text-white">${esc(l.empName)}</td><td class="p-3">${esc(l.date)}</td><td class="p-3 text-emerald-400">${esc(l.inTime)}</td><td class="p-3 text-rose-400">${esc(l.outTime)}</td><td class="p-3">${esc(l.status)}</td><td class="p-3 text-center hide-on-print"><button onclick="delLog('${esc(l.id)}')" class="text-rose-400 hover:text-rose-300 p-1"><i class="fa-solid fa-trash"></i></button></td></tr>`).join('');
}
function exportToExcel() {
  const ls = filteredLogs();
  if (!ls.length) return alert('لا توجد سجلات متاحة للتصدير');
  const q = v => { v = String(v ?? ''); if (/^[=+\-@]/.test(v)) v = "'" + v; return '"' + v.replace(/"/g, '""') + '"'; };
  let csv = '\uFEFFالفرع,اسم الموظف,التاريخ,وقت الدخول,وقت الخروج,حالة الشفت\n';
  ls.forEach(l => { csv += [l.branchName, l.empName, l.date, l.inTime, l.outTime, l.status].map(q).join(',') + '\n'; });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8;' }));
  a.download = `تقرير_الحضور_${$('branchFilter').value}_${new Date().toLocaleDateString('en-CA')}.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}
function switchTab(tab) {
  if (tab === 'mgr' && !isGen()) tab = 'rep';
  ['Emp', 'Mgr', 'Rep'].forEach(t => {
    $('tab' + t).classList.add('hidden');
    $('tab' + t + 'Btn').className = 'px-4 py-2 font-bold text-sm whitespace-nowrap text-slate-400' + ($('tab' + t + 'Btn').classList.contains('hidden') ? ' hidden' : '');
  });
  const t = { emp: 'Emp', mgr: 'Mgr', rep: 'Rep' }[tab];
  $('tab' + t).classList.remove('hidden');
  $('tab' + t + 'Btn').className = 'px-4 py-2 font-bold text-sm whitespace-nowrap text-' + (t === 'Mgr' ? 'amber' : 'emerald') + '-400 border-b-2 border-' + (t === 'Mgr' ? 'amber' : 'emerald') + '-500';
}
</script>
